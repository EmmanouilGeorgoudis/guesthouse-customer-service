<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Customers</title>
</head>
<body>
    <nav>
        <a th:href="@{/}">Home</a>
    </nav>

    <h1>Customers</h1>

    <div th:if="${successMessage}" th:text="${successMessage}" style="color: green;"></div>
    <div th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></div>

    <p><a th:href="@{/customers/new}">Add customer</a></p>

    <table border="1" cellpadding="8" cellspacing="0">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="customer : ${customers}">
                <td th:text="${customer.id}">1</td>
                <td th:text="${customer.name}">Customer name</td>
                <td>
                    <a th:href="@{/customers/edit/{id}(id=${customer.id})}">Edit</a>
                    <form th:action="@{/customers/delete/{id}(id=${customer.id})}" method="post" style="display:inline;">
                        <button type="submit" onclick="return confirm('Remove customer?')">Delete</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>
</body>
</html>
